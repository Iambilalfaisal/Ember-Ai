name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Tests use these services instead of starting containers (see tests/conftest.py).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMBER_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      EMBER_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check . ../eval

      - name: ruff format --check
        run: uv run ruff format --check . ../eval

      - name: mypy
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest

      # The migrations must apply, match the models, and be reversible.
      - name: Migrations (up, no drift, down, up)
        env:
          EMBER_ENV: test
          EMBER_DB__URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migrations_check
          EMBER_REDIS__URL: redis://localhost:6379/0
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE migrations_check'
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Contracts are up to date
        run: uv run python scripts/check_openapi_drift.py

      - name: Contracts type-check
        working-directory: contracts
        run: |
          npm ci
          npm run typecheck

      - name: Evaluation (no regression against the committed report)
        run: uv run python ../eval/run.py --check-regression
